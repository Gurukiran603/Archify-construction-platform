{% extends 'base/main.html' %}

{% block title %}403 - Access Denied{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-6 text-center">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <i class="fas fa-ban fa-5x text-danger mb-4"></i>
                <h1 class="display-1 fw-bold text-danger">403</h1>
                <h2 class="mb-3">Access Denied</h2>
                <p class="text-muted mb-4">Sorry, you don't have permission to access this page.</p>
                <div class="alert alert-info">
                    <i class="fas fa-info-circle me-2"></i>
                    <strong>Note:</strong> You need appropriate permissions to view this page.
                </div>
                <div class="mt-4">
                    <a href="javascript:history.back()" class="btn btn-secondary me-2">
                        <i class="fas fa-arrow-left me-2"></i>Go Back
                    </a>
                    <a href="{% url 'dashboard' %}" class="btn btn-primary">
                        <i class="fas fa-home me-2"></i>Go to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
