{% extends 'base/main.html' %}

{% block title %}Delete Site Update{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    Delete Site Update
                </h5>
            </div>
            <div class="card-body">
                <p class="mb-3">Are you sure you want to delete this site update?</p>
                
                <div class="alert alert-secondary mb-3">
                    <strong>{{ update.title }}</strong><br>
                    <small class="text-muted">{{ update.update_date|date:"F d, Y" }}</small>
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'site_update_list' update.project.id %}" class="btn btn-secondary">
                            <i class="fas fa-times me-2"></i>Cancel
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash me-2"></i>Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
